name: publish

"on":
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      wheel_name: ${{ steps.release.outputs.wheel_name }}
      sdist_name: ${{ steps.release.outputs.sdist_name }}
      source_archive_name: ${{ steps.release.outputs.source_archive_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release test dependencies
        run: |
          python -m pip install ".[test]" "pyarrow==21.0.0"
          python -m pip check
      - name: Verify release tag
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} 与项目版本 {version!r} 不一致")
          PY
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Check public source inventory
        run: python tools/public_source_inventory.py --project . --check
      - name: Run release contract tests
        run: >-
          python -m pytest -q
          tests/test_current_documentation.py
          tests/test_public_source_inventory.py
          tests/test_public_release_gates.py
          tests/test_release_envelope.py
          tests/test_release_gate_runner.py
          tests/test_capability_release_evidence.py
          tests/test_release_workflows.py
          tests/test_gate_c_evidence.py
      - name: Build release artifacts
        id: release
        shell: bash
        run: |
          python tools/build_release_artifacts.py --project . --output "$RUNNER_TEMP/quantwitness-release" > "$RUNNER_TEMP/quantwitness-build.json"
          python - "$RUNNER_TEMP/quantwitness-build.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if receipt.get("status") != "pass":
              raise SystemExit("正式构建未通过")
          names = ("wheel", "sdist", "source_archive")
          paths = {name: Path(receipt[name]).resolve(strict=True) for name in names}
          parents = {path.parent for path in paths.values()}
          if len(parents) != 1 or set(paths.values()) != set(next(iter(parents)).iterdir()):
              raise SystemExit("正式构建目录必须只包含本次三个发行产物")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for name, path in paths.items():
                  print(f"{name}={path}", file=output)
                  print(f"{name}_name={path.name}", file=output)
          PY
      - name: Verify isolated wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/quantwitness-release-env"
          python_bin="$RUNNER_TEMP/quantwitness-release-env/bin/python"
          "$python_bin" -m pip install "${{ steps.release.outputs.wheel }}[test]" "pyarrow==21.0.0"
          "$python_bin" -m pip check
          cd "$RUNNER_TEMP"
          "$python_bin" -c 'import importlib.metadata as m, research_pipeline; assert m.version("quantwitness") == "${{ github.ref_name }}"[1:]'
          "$RUNNER_TEMP/quantwitness-release-env/bin/quantwitness" --help
      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            ${{ steps.release.outputs.wheel }}
            ${{ steps.release.outputs.sdist }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: ${{ steps.release.outputs.source_archive }}
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quantwitness
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  finalize-release:
    name: Verify PyPI installation and attach release assets
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Verify clean PyPI installation
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m venv "$RUNNER_TEMP/quantwitness-pypi-env"
          python_bin="$RUNNER_TEMP/quantwitness-pypi-env/bin/python"
          "$python_bin" -m pip install --no-cache-dir --index-url https://pypi.org/simple "quantwitness==${RELEASE_TAG#v}"
          "$python_bin" -m pip check
          cd "$RUNNER_TEMP"
          "$python_bin" - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import sys
          import research_pipeline

          assert importlib.metadata.version("quantwitness") == os.environ["RELEASE_TAG"][1:]
          assert Path(research_pipeline.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
          "$RUNNER_TEMP/quantwitness-pypi-env/bin/quantwitness" --help
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist
      - name: Download source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: source-archive
          path: dist
      - name: Attach verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          WHEEL_PATH: dist/${{ needs.build.outputs.wheel_name }}
          SDIST_PATH: dist/${{ needs.build.outputs.sdist_name }}
          SOURCE_ARCHIVE_PATH: dist/${{ needs.build.outputs.source_archive_name }}
        run: gh release upload "$RELEASE_TAG" "$WHEEL_PATH" "$SDIST_PATH" "$SOURCE_ARCHIVE_PATH"
